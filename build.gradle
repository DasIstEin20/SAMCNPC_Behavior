plugins {
    id 'java-library'
    id 'net.minecraftforge.gradle' version '6.0.54'
    id 'org.jetbrains.kotlin.jvm' version '2.2.21'
}

group = providers.gradleProperty('mod_group').get()
version = providers.gradleProperty('mod_version').get()

repositories {
    mavenCentral()
    maven {
        name = 'KotlinForForge'
        url = 'https://thedarkcolour.github.io/KotlinForForge/'
        content { includeGroup 'thedarkcolour' }
    }
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(17)
    }
}

tasks.withType(JavaCompile).configureEach {
    options.release = 17
    options.encoding = 'UTF-8'
}

tasks.withType(org.jetbrains.kotlin.gradle.tasks.KotlinJvmCompile).configureEach {
    compilerOptions {
        jvmTarget = org.jetbrains.kotlin.gradle.dsl.JvmTarget.JVM_17
        freeCompilerArgs.add('-Xjvm-default=all')
    }
}

tasks.withType(Test).configureEach {
    useJUnitPlatform()
}

// The published Core build supplies the source set used by ForgeGradle's dev remapping.
ext.fullVerificationId = null
evaluationDependsOn(':samcnpc-core')

def forestSmokeWorld = "forest-repair-${System.currentTimeMillis()}"
def operationsSmokeId = providers.gradleProperty('operationsSmokeId').orElse(rootProject.ext.fullVerificationId ?: 'manual').get()
if (!(operationsSmokeId ==~ /[A-Za-z0-9_-]+/)) throw new GradleException('operationsSmokeId must contain only letters, digits, underscores or hyphens')

minecraft {
    mappings channel: 'official', version: minecraft_version
    copyIdeResources = true

    runs {
        configureEach {
            workingDirectory project.file('run')
            property 'forge.logging.console.level', 'info'
            property 'forge.enabledGameTestNamespaces', 'samcnpc_behavior'
            mods {
                // Behavior's dev runs must load Core through the same userdev remapping path as
                // the standalone Core run. A reobfuscated project JAR here would link against
                // runtime names before ForgeGradle has a chance to remap it.
                samcnpc_core {
                    source project(':samcnpc-core').sourceSets.main
                }
                samcnpc_behavior {
                    source sourceSets.main
                }
            }
        }
        client {}
        clientConfigSmoke {
            parent runs.client
            workingDirectory project.file('run-config-smoke')
            property 'samcnpc.configSmoke', 'true'
            property 'samcnpc.configSmokeCompanionReport', 'tool-settings-behavior-result.txt'
            property 'samcnpc.toolSettingsVariant', providers.gradleProperty('toolSettingsVariant').orElse('missing').get()
            mods {
                samcnpc_core { source project(':samcnpc-core').sourceSets.test }
                samcnpc_behavior { source sourceSets.test }
            }
        }
        clientConfigSmokeBare {
            parent runs.clientConfigSmoke
            workingDirectory project.file('run-config-bare-smoke')
            property 'samcnpc.toolSettingsVariant', 'bare_hands'
        }
        clientConfigSmokeDurable {
            parent runs.clientConfigSmoke
            workingDirectory project.file('run-config-durable-smoke')
            property 'samcnpc.toolSettingsVariant', 'durable'
        }
        clientTaskSmoke {
            parent runs.client
            workingDirectory project.file('run-task-smoke')
            property 'samcnpc.taskSmoke', 'true'
            property 'samcnpc.coreLifecycleProbe', 'true'
            mods {
                samcnpc_core { source project(':samcnpc-core').sourceSets.test }
                samcnpc_behavior { source sourceSets.test }
            }
        }
        clientTaskCombatSmoke {
            parent runs.client
            workingDirectory project.file('run-task-combat-smoke')
            property 'samcnpc.taskCombatSmoke', 'true'
            mods { samcnpc_behavior { source sourceSets.test } }
        }
        clientRetaliationSmoke {
            parent runs.client
            workingDirectory project.file('run-retaliation-smoke')
            property 'samcnpc.retaliationSmoke', 'true'
            mods { samcnpc_behavior { source sourceSets.test } }
        }
        clientFollowSmoke {
            parent runs.client
            workingDirectory project.file('run-follow-smoke')
            property 'samcnpc.followSmoke', 'true'
            mods { samcnpc_behavior { source sourceSets.test } }
        }
        clientLumberjackSmoke {
            parent runs.client
            workingDirectory project.file('run-lumberjack-smoke')
            property 'samcnpc.lumberjackSmoke', 'true'
            property 'samcnpc.lumberjackGuiProbe', providers.gradleProperty('lumberjackGuiProbe').orElse('').get()
            mods { samcnpc_behavior { source sourceSets.test } }
        }
        clientForestRepairSmoke {
            parent runs.client
            workingDirectory project.file('run-forest-repair')
            property 'samcnpc.forestRepairSmoke', 'true'
            property 'samcnpc.forestSmokeWorld', forestSmokeWorld
            property 'samcnpc.forestSam3Only', providers.gradleProperty('forestSam3Only').orElse('false').get()
            mods { samcnpc_behavior { source sourceSets.test } }
        }
        clientOperationsSmoke {
            parent runs.client
            workingDirectory project.file("run-operations-client-${operationsSmokeId}")
            property 'samcnpc.operationsClient', 'true'
            mods { samcnpc_behavior { source sourceSets.test } }
        }
        server { args '--nogui' }
        serverOperationsSmokeSave {
            taskName 'runOperationsSmokeSave'
            parent runs.server
            workingDirectory project.file("run-operations-${operationsSmokeId}")
            property 'samcnpc.operationsRestart', 'save'
            jvmArgs '-Xms1G', '-Xmx4G'
            mods { samcnpc_behavior { source sourceSets.test } }
        }
        serverOperationsSmokeLoad {
            taskName 'runOperationsSmokeLoad'
            parent runs.server
            workingDirectory project.file("run-operations-${operationsSmokeId}")
            property 'samcnpc.operationsRestart', 'load'
            jvmArgs '-Xms1G', '-Xmx4G'
            mods { samcnpc_behavior { source sourceSets.test } }
        }
        serverOperationsLifecycle {
            taskName 'runOperationsLifecycle'
            parent runs.server
            workingDirectory project.file("run-operations-lifecycle-${operationsSmokeId}")
            property 'samcnpc.operationsLifecycle', 'true'
            property 'samcnpc.coreLifecycleProbe', 'true'
            jvmArgs '-Xms1G', '-Xmx4G'
            mods {
                samcnpc_core { source project(':samcnpc-core').sourceSets.test }
                samcnpc_behavior { source sourceSets.test }
            }
        }
        serverOperationsPerformance {
            taskName 'runOperationsPerformance'
            parent runs.server
            workingDirectory project.file("run-operations-performance-${operationsSmokeId}")
            property 'samcnpc.operationsPerformance', 'true'
            property 'samcnpc.behavior.profile', 'true'
            jvmArgs '-Xms2G', '-Xmx4G'
            mods { samcnpc_behavior { source sourceSets.test } }
        }
        serverOperationsSoak {
            taskName 'runOperationsSoak'
            parent runs.server
            workingDirectory project.file("run-operations-soak-${operationsSmokeId}")
            property 'samcnpc.operationsSoak', 'true'
            jvmArgs '-Xms2G', '-Xmx4G'
            mods { samcnpc_behavior { source sourceSets.test } }
        }
        gameTestServer {
            workingDirectory project.file('run-gametest')
            // Manual fixture geometry extends beyond the template's reset box. Never inherit
            // old containers/entities when the suite layout changes between invocations.
            args '--world', "gametest-${System.currentTimeMillis()}"
        }
    }
}

def forestSnapshot = providers.gradleProperty('forestSnapshot')
def prepareForestRepairSmoke = tasks.register('prepareForestRepairSmoke', Copy) {
    from layout.projectDirectory.dir('src/main/resources')
    into layout.projectDirectory.dir('run-forest-repair')
    into("saves/${forestSmokeWorld}") {
        from { forestSnapshot.isPresent() ? project.file(forestSnapshot.get()) : project.files() }
    }
    doFirst {
        if (!forestSnapshot.isPresent() || !new File(project.file(forestSnapshot.get()), 'level.dat').isFile()) {
            throw new GradleException('Supply -PforestSnapshot=<paused regression world copy> containing level.dat')
        }
    }
}

tasks.matching { it.name == 'runClientForestRepairSmoke' }.configureEach {
    dependsOn prepareForestRepairSmoke
    def report = layout.projectDirectory.file('run-forest-repair/forest-repair-result.txt').asFile
    doFirst { report.text = 'RUNNING\n' }
    doLast {
        if (!report.text.trim().endsWith('PASS')) throw new GradleException("Forest repair smoke failed: ${report}")
    }
}

dependencies {
    minecraft "net.minecraftforge:forge:${minecraft_version}-${forge_version}"
    implementation fg.deobf(project(':samcnpc-core'))
    implementation "thedarkcolour:kotlinforforge:${kotlin_for_forge_version}"
    testImplementation 'org.junit.jupiter:junit-jupiter:5.10.2'
    testImplementation "org.jetbrains.kotlin:kotlin-test:${kotlin_version}"
}

// Plain JVM tests use development names, just like Forge's source-set dev runs. The packaged
// Core JAR is reobfuscated for distribution and cannot call mapped Minecraft methods in JUnit.
tasks.withType(Test).configureEach {
    dependsOn ':samcnpc-core:classes'
    classpath = files(project(':samcnpc-core').sourceSets.main.output) + classpath
}

tasks.named('processResources', ProcessResources).configure {
    inputs.property 'version', project.version
    filesMatching('META-INF/mods.toml') {
        expand version: project.version
    }
}

tasks.named('jar', Jar).configure {
    archiveBaseName = 'samcnpc-behavior'
    manifest {
        attributes([
            'Specification-Title': project.name,
            'Specification-Vendor': 'SAMCNPC',
            'Specification-Version': '1',
            'Implementation-Title': project.name,
            'Implementation-Version': project.version,
            'Implementation-Vendor': 'SAMCNPC'
        ])
    }
    finalizedBy 'reobfJar'
}

// Stage JSON packs and fixtures for fresh command-line userdev runs without an IDE.
def prepareRunResources = tasks.register('prepareRunResources', Copy) {
    from layout.projectDirectory.dir('src/main/resources')
    into layout.projectDirectory.dir('run')
}

tasks.configureEach {
    if (name in ['runClient', 'runServer']) {
        dependsOn prepareRunResources
    }
}

// A normal dev world's water/terrain must never leak into GameTest fixtures.
def prepareGameTestResources = tasks.register('prepareGameTestResources', Copy) {
    from layout.projectDirectory.dir('src/main/resources')
    from layout.projectDirectory.dir('src/test/resources/gametest')
    into layout.projectDirectory.dir('run-gametest')
}

tasks.matching { it.name == 'runGameTestServer' }.configureEach {
    dependsOn prepareGameTestResources
}

def prepareLumberjackSmokeResources = tasks.register('prepareLumberjackSmokeResources', Copy) {
    from layout.projectDirectory.dir('src/main/resources')
    into layout.projectDirectory.dir('run-lumberjack-smoke')
}

def prepareConfigSmokeResources = tasks.register('prepareConfigSmokeResources', Copy) {
    from layout.projectDirectory.dir('src/main/resources')
    into layout.projectDirectory.dir('run-config-smoke')
}

tasks.matching { it.name == 'runClientConfigSmoke' }.configureEach {
    dependsOn prepareConfigSmokeResources, ':samcnpc-core:testClasses'
    def report = layout.projectDirectory.file('run-config-smoke/config-smoke-result.txt').asFile
    def companion = layout.projectDirectory.file('run-config-smoke/tool-settings-behavior-result.txt').asFile
    doFirst {
        report.parentFile.mkdirs()
        report.text = 'RUNNING\n'
        companion.text = 'RUNNING\n'
    }
    doLast {
        if (!report.text.trim().endsWith('PASS') || !companion.text.trim().endsWith('PASS')) {
            throw new GradleException("Configuration client smoke failed: ${report}")
        }
    }
}

tasks.matching { it.name == 'runClientLumberjackSmoke' }.configureEach {
    dependsOn prepareLumberjackSmokeResources
    def report = layout.projectDirectory.file('run-lumberjack-smoke/lumberjack-smoke-result.txt').asFile
    doFirst {
        report.parentFile.mkdirs()
        report.text = 'RUNNING\n'
    }
    doLast {
        if (!report.exists() || !report.text.trim().endsWith('PASS')) {
            throw new GradleException("Lumberjack client smoke did not pass: ${report}")
        }
    }
}

// P04 drives actual commands, saves/closes the integrated server and reopens the same world.
def prepareTaskSmokeResources = tasks.register('prepareTaskSmokeResources', Copy) {
    from layout.projectDirectory.dir('src/main/resources')
    into layout.projectDirectory.dir('run-task-smoke')
}
tasks.matching { it.name == 'runClientTaskSmoke' }.configureEach {
    dependsOn prepareTaskSmokeResources
    def report = layout.projectDirectory.file('run-task-smoke/task-smoke-result.txt').asFile
    doFirst { report.parentFile.mkdirs(); report.text = 'RUNNING\n' }
    doLast {
        if (!report.exists() || !report.text.trim().endsWith('PASS')) throw new GradleException("Task client smoke failed: ${report}")
    }
}

// P06 exercises the same physical follow scenario with a real connected client.
def prepareFollowSmokeResources = tasks.register('prepareFollowSmokeResources', Copy) {
    from layout.projectDirectory.dir('src/main/resources')
    into layout.projectDirectory.dir('run-follow-smoke')
}
tasks.matching { it.name == 'runClientFollowSmoke' }.configureEach {
    dependsOn prepareFollowSmokeResources
    def report = layout.projectDirectory.file('run-follow-smoke/follow-smoke-result.txt').asFile
    doFirst { report.parentFile.mkdirs(); report.text = 'RUNNING\n' }
    doLast {
        if (!report.exists() || !report.text.trim().endsWith('PASS')) throw new GradleException("Follow client smoke failed: ${report}")
    }
}

// P06 shares physical retaliation/permission/lifecycle assertions with the real client.
def prepareRetaliationSmokeResources = tasks.register('prepareRetaliationSmokeResources', Copy) {
    from layout.projectDirectory.dir('src/main/resources')
    into layout.projectDirectory.dir('run-retaliation-smoke')
}
tasks.matching { it.name == 'runClientRetaliationSmoke' }.configureEach {
    dependsOn prepareRetaliationSmokeResources
    def report = layout.projectDirectory.file('run-retaliation-smoke/retaliation-smoke-result.txt').asFile
    doFirst { report.parentFile.mkdirs(); report.text = 'RUNNING\n' }
    doLast {
        if (!report.exists() || !report.text.trim().endsWith('PASS')) throw new GradleException("Retaliation client smoke failed: ${report}")
    }
}

// P06 proves a complete physical work -> damage -> combat -> resumed delivery cycle.
def prepareTaskCombatSmokeResources = tasks.register('prepareTaskCombatSmokeResources', Copy) {
    from layout.projectDirectory.dir('src/main/resources')
    into layout.projectDirectory.dir('run-task-combat-smoke')
}
tasks.matching { it.name == 'runClientTaskCombatSmoke' }.configureEach {
    dependsOn prepareTaskCombatSmokeResources
    def report = layout.projectDirectory.file('run-task-combat-smoke/task-combat-smoke-result.txt').asFile
    doFirst { report.parentFile.mkdirs(); report.text = 'RUNNING\n' }
    doLast {
        if (!report.exists() || !report.text.trim().endsWith('PASS')) throw new GradleException("Task combat client smoke failed: ${report}")
    }
}


// Separate run directories preserve each GUI variant's report during verifyAll.
['Bare': 'bare', 'Durable': 'durable'].each { suffix, folder ->
    def stage = tasks.register("prepareConfig${suffix}SmokeResources", Copy) {
        from layout.projectDirectory.dir('src/main/resources')
        into layout.projectDirectory.dir("run-config-${folder}-smoke")
    }
    tasks.matching { it.name == "runClientConfigSmoke${suffix}" }.configureEach {
        dependsOn stage, ':samcnpc-core:testClasses'
        def report = project.file("run-config-${folder}-smoke/config-smoke-result.txt")
        def companion = project.file("run-config-${folder}-smoke/tool-settings-behavior-result.txt")
        doFirst {
            report.parentFile.mkdirs()
            report.text = 'RUNNING\n'
            companion.text = 'RUNNING\n'
        }
        doLast {
            if (!report.text.trim().endsWith('PASS') || !companion.text.trim().endsWith('PASS')) {
                throw new GradleException("${suffix} configuration smoke failed: ${report}")
            }
        }
    }
}


// Ordinary dedicated runs retain Minecraft's actual pacing and save/load through separate JVMs.
def operationRuns = [
    runOperationsSmokeSave: [directory: "run-operations-${operationsSmokeId}", report: 'operations-save.txt', port: 25577],
    runOperationsSmokeLoad: [directory: "run-operations-${operationsSmokeId}", report: 'operations-load.txt', port: 25577],
    runOperationsLifecycle: [directory: "run-operations-lifecycle-${operationsSmokeId}", report: 'operations-lifecycle.txt', port: 25580],
    runOperationsPerformance: [directory: "run-operations-performance-${operationsSmokeId}", report: 'operations-performance.txt', port: 25578],
    runOperationsSoak: [directory: "run-operations-soak-${operationsSmokeId}", report: 'operations-soak.txt', port: 25579],
    runClientOperationsSmoke: [directory: "run-operations-client-${operationsSmokeId}", report: 'operations-client.txt'],
]
operationRuns.each { taskName, config ->
    def resources = tasks.register("prepare${taskName.substring(3)}Resources", Copy) {
        from layout.projectDirectory.dir('src/main/resources')
        into layout.projectDirectory.dir(config.directory)
    }
    tasks.matching { it.name == taskName }.configureEach {
        dependsOn resources
        def report = project.file("${config.directory}/${config.report}")
        doFirst {
            report.parentFile.mkdirs()
            report.text = 'RUNNING\n'
            if (config.port != null) {
                // Project-scoped EULA authorization: root AGENTS.md section12.
                new File(report.parentFile, 'eula.txt').text = 'eula=true\n'
                def settings = new File(report.parentFile, 'server.properties')
                if (!settings.exists()) settings.text = """server-ip=127.0.0.1
server-port=${config.port}
online-mode=true
level-name=world
level-type=minecraft:flat
level-seed=0
generate-structures=false
view-distance=4
simulation-distance=4
max-players=1
spawn-protection=0
"""
            }
        }
        doLast { if (!report.text.startsWith('PASS ')) throw new GradleException("Operations verification failed: ${report}") }
    }
}
tasks.matching { it.name == 'runOperationsSmokeLoad' }.configureEach {
    mustRunAfter tasks.matching { it.name == 'runOperationsSmokeSave' }
    if (rootProject.ext.fullVerificationId != null || gradle.startParameter.taskNames.any { it.tokenize(':').last() == 'runOperationsSmokeSave' }) dependsOn 'runOperationsSmokeSave'
}

// The Core observer verifies final disposal in the same real server/client lifecycles.
[
    runClientTaskSmoke: [directory: 'run-task-smoke', count: 4],
    runOperationsLifecycle: [directory: "run-operations-lifecycle-${operationsSmokeId}", count: 1],
].each { taskName, config ->
    tasks.matching { it.name == taskName }.configureEach {
        dependsOn ':samcnpc-core:testClasses'
        def report = project.file("${config.directory}/core-lifecycle-result.txt")
        doFirst { report.parentFile.mkdirs(); report.text = 'RUNNING\n' }
        doLast {
            if (!report.exists() || !report.text.startsWith("PASS started=${config.count} stopped=${config.count} ")) {
                throw new GradleException("Core server lifecycle did not pass: ${report}")
            }
        }
    }
}

tasks.register('verifyProductionKotlin') {
    group = 'verification'
    doLast {
        def javaSources = fileTree('src/main') { include '**/*.java' }.files
        if (!javaSources.empty) {
            throw new GradleException("Production source must be Kotlin: ${javaSources.join(', ')}")
        }
    }
}

tasks.named('check').configure {
    dependsOn tasks.named('verifyProductionKotlin')
}

// A flaky retry can fail after vanilla's original batch tracker has already advanced. Its final
// aggregate/exit may still be green; an explicit required failure in this run always fails the gate.
tasks.matching { it.name == 'runGameTestServer' }.configureEach {
    doLast {
        def report = new File(workingDir, 'logs/latest.log')
        if (!report.isFile()) throw new GradleException("GameTest result log is missing: ${report}")
        def failures = []
        report.eachLine('UTF-8') { line ->
            if (line.contains('/ERROR]') && line.contains('LogTestReporter') && line.contains(' failed!')) failures.add(line)
        }
        if (!failures.isEmpty()) throw new GradleException("${failures.size()} required GameTest failure(s) despite runner exit: ${failures.first()}. See ${report}")
    }
}
