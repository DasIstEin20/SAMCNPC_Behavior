plugins {
    id 'java-library'
    id 'net.minecraftforge.gradle' version '6.0.54'
    id 'org.jetbrains.kotlin.jvm' version '2.2.21'
}
group = providers.gradleProperty('mod_group').get()
version = providers.gradleProperty('mod_version').get()
repositories {
    mavenCentral()
    maven { name = 'KotlinForForge'; url = 'https://thedarkcolour.github.io/KotlinForForge/'; content { includeGroup 'thedarkcolour' } }
}
java { toolchain { languageVersion = JavaLanguageVersion.of(17) } }
tasks.withType(JavaCompile).configureEach { options.release = 17; options.encoding = 'UTF-8' }
tasks.withType(org.jetbrains.kotlin.gradle.tasks.KotlinJvmCompile).configureEach {
    compilerOptions { jvmTarget = org.jetbrains.kotlin.gradle.dsl.JvmTarget.JVM_17; freeCompilerArgs.add('-Xjvm-default=all') }
}
tasks.withType(Test).configureEach { useJUnitPlatform() }
if (!rootProject.ext.has('fullVerificationId')) rootProject.ext.fullVerificationId = null
evaluationDependsOn(':samcnpc-core')

def forestSmokeWorld = "forest-repair-${System.currentTimeMillis()}"
def operationsSmokeId = providers.gradleProperty('operationsSmokeId').orElse(rootProject.ext.fullVerificationId ?: 'manual').get()
if (!(operationsSmokeId ==~ /[A-Za-z0-9_-]+/)) throw new GradleException('operationsSmokeId must contain only letters, digits, underscores or hyphens')

def pickupRecoveryOnly = providers.gradleProperty('pickupRecoveryOnly').orElse('false').get().toBoolean()
def campaignId = providers.gradleProperty('campaignId').orElse('manual').get()
def campaignMode = providers.gradleProperty('campaignMode').orElse('baseline').get()
def externalWorkModes = ['machine','machine_cancel','couriers','couriers_partial','guard','guard_pause']
def boundaryModes = ['boundary_save','boundary_load','receipt_save','receipt_load','physical_save','physical_load','pause_save','pause_load','cancel_save','cancel_load','pack_changed','pack_removed','corrupt','full_soak','full_boundary_save','full_boundary_load']
if (!(campaignId ==~ /[A-Za-z0-9_-]+/) || !(campaignMode in ['baseline','pause','cancel','save','load','pack_only','loader','full','full_save','full_load','full_no_coal','full_cancel','full_stock_loss'] + externalWorkModes + boundaryModes)) throw new GradleException('Invalid external campaign parameters')
def machineCompatibility = providers.gradleProperty('machineCompatibility').orElse('false').get().toBoolean()
def gameTestNamespace = providers.gradleProperty('gameTestNamespace').orElse(pickupRecoveryOnly ? 'samcnpc_pickup_zoo' : 'samcnpc_behavior,samcnpc_pickup_zoo,samcnpc_machine_zoo,samcnpc_fishing_zoo,samcnpc_explorer_zoo,samcnpc_mining_zoo,samcnpc_shared_site_zoo,samcnpc_field_zoo,samcnpc_local_autonomy').get()
if (!gameTestNamespace.split(',').every { it in ['samcnpc_behavior', 'samcnpc_pickup_zoo', 'samcnpc_machine_zoo', 'samcnpc_fishing_zoo', 'samcnpc_explorer_zoo', 'samcnpc_mining_zoo', 'samcnpc_shared_site_zoo', 'samcnpc_field_zoo', 'samcnpc_local_autonomy'] }) throw new GradleException('Unknown GameTest namespace')

minecraft {
    mappings channel: 'official', version: minecraft_version
    copyIdeResources = true

    runs {
        configureEach {
            workingDirectory project.file('run')
            property 'forge.logging.console.level', 'info'
            property 'samcnpc.machineFixture', machineCompatibility ? 'iron-furnaces-4.1.8' : 'vanilla-furnace'
            property 'forge.enabledGameTestNamespaces', 'samcnpc_behavior'
            mods {
                // Behavior's dev runs must load Core through the same userdev remapping path as
                // the standalone Core run. A reobfuscated project JAR here would link against
                // runtime names before ForgeGradle has a chance to remap it.
                samcnpc_core {
                    source project(':samcnpc-core').sourceSets.main
                }
                samcnpc_behavior {
                    source sourceSets.main
                }
            }
        }
        client {}
        clientExternalMission {
            parent runs.client
            workingDirectory project.file("run-external-client-${campaignId}")
            property 'samcnpc.externalMissionClient', 'true'
            mods { samcnpc_behavior { source sourceSets.test } }
        }
        clientConfigSmoke {
            parent runs.client
            workingDirectory project.file('run-config-smoke')
            property 'samcnpc.configSmoke', 'true'
            property 'samcnpc.configSmokeCompanionReport', 'tool-settings-behavior-result.txt'
            property 'samcnpc.toolSettingsVariant', providers.gradleProperty('toolSettingsVariant').orElse('missing').get()
            mods {
                samcnpc_core { source project(':samcnpc-core').sourceSets.test }
                samcnpc_behavior { source sourceSets.test }
            }
        }
        clientConfigSmokeBare {
            parent runs.clientConfigSmoke
            workingDirectory project.file('run-config-bare-smoke')
            property 'samcnpc.toolSettingsVariant', 'bare_hands'
        }
        clientConfigSmokeDurable {
            parent runs.clientConfigSmoke
            workingDirectory project.file('run-config-durable-smoke')
            property 'samcnpc.toolSettingsVariant', 'durable'
        }
        clientTaskSmoke {
            parent runs.client
            workingDirectory project.file('run-task-smoke')
            property 'samcnpc.taskSmoke', 'true'
            property 'samcnpc.coreLifecycleProbe', 'true'
            mods {
                samcnpc_core { source project(':samcnpc-core').sourceSets.test }
                samcnpc_behavior { source sourceSets.test }
            }
        }
        clientTaskCombatSmoke {
            parent runs.client
            workingDirectory project.file('run-task-combat-smoke')
            property 'samcnpc.taskCombatSmoke', 'true'
            mods { samcnpc_behavior { source sourceSets.test } }
        }
        clientRetaliationSmoke {
            parent runs.client
            workingDirectory project.file('run-retaliation-smoke')
            property 'samcnpc.retaliationSmoke', 'true'
            mods { samcnpc_behavior { source sourceSets.test } }
        }
        clientFollowSmoke {
            parent runs.client
            workingDirectory project.file('run-follow-smoke')
            property 'samcnpc.followSmoke', 'true'
            mods { samcnpc_behavior { source sourceSets.test } }
        }
        clientLumberjackSmoke {
            parent runs.client
            workingDirectory project.file('run-lumberjack-smoke')
            property 'samcnpc.lumberjackSmoke', 'true'
            property 'samcnpc.lumberjackGuiProbe', providers.gradleProperty('lumberjackGuiProbe').orElse('').get()
            mods { samcnpc_behavior { source sourceSets.test } }
        }
        clientForestRepairSmoke {
            parent runs.client
            workingDirectory project.file('run-forest-repair')
            property 'samcnpc.forestRepairSmoke', 'true'
            property 'samcnpc.forestSmokeWorld', forestSmokeWorld
            property 'samcnpc.forestSam3Only', providers.gradleProperty('forestSam3Only').orElse('false').get()
            mods { samcnpc_behavior { source sourceSets.test } }
        }
        clientOperationsSmoke {
            parent runs.client
            workingDirectory project.file("run-operations-client-${operationsSmokeId}")
            property 'samcnpc.operationsClient', 'true'
            mods { samcnpc_behavior { source sourceSets.test } }
        }
        server { args '--nogui' }
        serverExternalMission {
            taskName 'runExternalMission'
            parent runs.server
            workingDirectory project.file("run-external-mission-${campaignId}")
            property (campaignMode in externalWorkModes ? 'samcnpc.externalWork' : 'samcnpc.externalMission'), campaignMode
            mods { samcnpc_behavior { source sourceSets.test } }
        }
        serverOperationsSmokeSave {
            taskName 'runOperationsSmokeSave'
            parent runs.server
            workingDirectory project.file("run-operations-${operationsSmokeId}")
            property 'samcnpc.operationsRestart', 'save'
            jvmArgs '-Xms1G', '-Xmx4G'
            mods { samcnpc_behavior { source sourceSets.test } }
        }
        serverOperationsSmokeLoad {
            taskName 'runOperationsSmokeLoad'
            parent runs.server
            workingDirectory project.file("run-operations-${operationsSmokeId}")
            property 'samcnpc.operationsRestart', 'load'
            jvmArgs '-Xms1G', '-Xmx4G'
            mods { samcnpc_behavior { source sourceSets.test } }
        }
        serverOperationsLifecycle {
            taskName 'runOperationsLifecycle'
            parent runs.server
            workingDirectory project.file("run-operations-lifecycle-${operationsSmokeId}")
            property 'samcnpc.operationsLifecycle', 'true'
            property 'samcnpc.coreLifecycleProbe', 'true'
            jvmArgs '-Xms1G', '-Xmx4G'
            mods {
                samcnpc_core { source project(':samcnpc-core').sourceSets.test }
                samcnpc_behavior { source sourceSets.test }
            }
        }
        serverExplorerLifecycleDrop {
            taskName 'runExplorerLifecycleDrop'
            parent runs.server
            workingDirectory project.file("run-explorer-drop-${operationsSmokeId}")
            property 'samcnpc.explorerLifecycle', 'DROP'
            property 'samcnpc.deathPolicyFixture', 'DROP'
            jvmArgs '-Xms1G', '-Xmx4G'
            mods {
                samcnpc_core { source project(':samcnpc-core').sourceSets.test }
                samcnpc_behavior { source sourceSets.test }
            }
        }
        serverExplorerLifecycleKeep {
            taskName 'runExplorerLifecycleKeep'
            parent runs.server
            workingDirectory project.file("run-explorer-keep-${operationsSmokeId}")
            property 'samcnpc.explorerLifecycle', 'KEEP'
            property 'samcnpc.deathPolicyFixture', 'KEEP'
            jvmArgs '-Xms1G', '-Xmx4G'
            mods {
                samcnpc_core { source project(':samcnpc-core').sourceSets.test }
                samcnpc_behavior { source sourceSets.test }
            }
        }
        serverOperationsPerformance {
            taskName 'runOperationsPerformance'
            parent runs.server
            workingDirectory project.file("run-operations-performance-${operationsSmokeId}")
            property 'samcnpc.operationsPerformance', 'true'
            property 'samcnpc.behavior.profile', 'true'
            jvmArgs '-Xms2G', '-Xmx4G'
            mods { samcnpc_behavior { source sourceSets.test } }
        }
        serverAcceptanceZoo {
            taskName 'runAcceptanceZoo'
            parent runs.server
            workingDirectory project.file("run-acceptance-zoo-${operationsSmokeId}")
            property 'samcnpc.acceptanceZoo', 'true'
            property 'samcnpc.zooProfile', providers.gradleProperty('zooProfile').orElse('z1').get()
            property 'samcnpc.zooSeed', providers.gradleProperty('zooSeed').orElse('20260912').get()
            property 'samcnpc.zooSourceHash', providers.gradleProperty('zooSourceHash').orElse('not_supplied').get()
            jvmArgs '-Xms1G', '-Xmx4G'
            mods { samcnpc_behavior { source sourceSets.test } }
        }
        serverZooHour {
            taskName 'runZooHour'
            parent runs.server
            workingDirectory project.file("run-zoo-hour-${operationsSmokeId}")
            property 'samcnpc.zooHour', 'FULL'
            property 'samcnpc.zooSourceHash', providers.gradleProperty('zooSourceHash').orElse('not_supplied').get()
            property 'samcnpc.behavior.profile', 'true'
            property 'samcnpc.coreLifecycleProbe', 'true'
            jvmArgs '-Xms2G', '-Xmx4G'
            mods {
                samcnpc_core { source project(':samcnpc-core').sourceSets.test }
                samcnpc_behavior { source sourceSets.test }
            }
        }
        serverZooHourProbe {
            taskName 'runZooHourProbe'
            parent runs.server
            workingDirectory project.file("run-zoo-hour-probe-${operationsSmokeId}")
            property 'samcnpc.zooHour', 'PROBE'
            property 'samcnpc.zooSourceHash', providers.gradleProperty('zooSourceHash').orElse('not_supplied').get()
            property 'samcnpc.behavior.profile', 'true'
            property 'samcnpc.coreLifecycleProbe', 'true'
            jvmArgs '-Xms2G', '-Xmx4G'
            mods {
                samcnpc_core { source project(':samcnpc-core').sourceSets.test }
                samcnpc_behavior { source sourceSets.test }
            }
        }
        serverOperationsSoak {
            taskName 'runOperationsSoak'
            parent runs.server
            workingDirectory project.file("run-operations-soak-${operationsSmokeId}")
            property 'samcnpc.operationsSoak', 'true'
            jvmArgs '-Xms2G', '-Xmx4G'
            mods { samcnpc_behavior { source sourceSets.test } }
        }
        gameTestServer {
            property 'forge.enabledGameTestNamespaces', gameTestNamespace
            property 'samcnpc.sharedSiteTrace', providers.gradleProperty('sharedSiteTrace').orElse('false').get()
            mods { samcnpc_behavior { source sourceSets.test } }
            workingDirectory project.file('run-gametest')
            // Manual fixture geometry extends beyond the template's reset box. Never inherit
            // old containers/entities when the suite layout changes between invocations.
            args '--world', "gametest-${System.currentTimeMillis()}"
        }
    }
}

def prepareForestRepairSmoke = tasks.register('prepareForestRepairSmoke', Copy) {
    def snapshot = rootProject.file(providers.gradleProperty('forestSnapshot').orElse('autonomy/manual-debug-20260908-2047/world-snapshot').get())
    from layout.projectDirectory.dir('src/main/resources')
    into layout.projectDirectory.dir('run-forest-repair')
    into("saves/${forestSmokeWorld}") { from snapshot }
    doFirst {
        if (!new File(snapshot, 'level.dat').isFile()) throw new GradleException("Supply -PforestSnapshot=<paused world copy>; missing level.dat: ${snapshot}")
    }
}

tasks.matching { it.name == 'runClientForestRepairSmoke' }.configureEach {
    dependsOn prepareForestRepairSmoke
    def report = layout.projectDirectory.file('run-forest-repair/forest-repair-result.txt').asFile
    doFirst { report.text = 'RUNNING\n' }
    doLast {
        if (!report.text.trim().endsWith('PASS')) throw new GradleException("Forest repair smoke failed: ${report}")
    }
}

// Optional development compatibility fixture; no production mod dependency or bundled JAR.
if (machineCompatibility) {
    repositories {
        exclusiveContent {
            forRepository { maven { name = 'ModrinthCompatibility'; url = 'https://api.modrinth.com/maven' } }
            forRepositories(fg.repository)
            filter { includeGroup 'maven.modrinth' }
        }
    }
    // A dev fixture must not enter runtimeElements and then the dependent LLM userdev
    // remapper as an already-mapped transitive dependency.
    configurations {
        machineCompatibilityRuntime { canBeConsumed = false; canBeResolved = false }
        runtimeClasspath.extendsFrom machineCompatibilityRuntime
        testRuntimeClasspath.extendsFrom machineCompatibilityRuntime
    }
    dependencies { machineCompatibilityRuntime fg.deobf('maven.modrinth:iron-furnaces:KHAcRQwi') }
}

dependencies {
    minecraft "net.minecraftforge:forge:${minecraft_version}-${forge_version}"
    implementation project(':samcnpc-core')
    implementation "thedarkcolour:kotlinforforge:${kotlin_for_forge_version}"
    testImplementation 'org.junit.jupiter:junit-jupiter:5.10.2'
    testImplementation "org.jetbrains.kotlin:kotlin-test:${kotlin_version}"
}

// Plain JVM tests use development names, just like Forge's source-set dev runs. The packaged
// Core JAR is reobfuscated for distribution and cannot call mapped Minecraft methods in JUnit.
tasks.withType(Test).configureEach {
    dependsOn ':samcnpc-core:classes'
    classpath = files(project(':samcnpc-core').sourceSets.main.output) + classpath
}

tasks.named('processResources', ProcessResources).configure {
    def identitySources = files(fileTree('src/main'), file('build.gradle'), rootProject.file('build.gradle'), rootProject.file('gradle.properties')).files
    def fingerprint = java.security.MessageDigest.getInstance('SHA-256')
    identitySources.sort { rootProject.relativePath(it).replace('\\', '/') }.each { source ->
        fingerprint.update(rootProject.relativePath(source).replace('\\', '/').getBytes('UTF-8'))
        fingerprint.update((byte) 0)
        fingerprint.update(source.bytes)
        fingerprint.update((byte) 0)
    }
    def buildId = fingerprint.digest().encodeHex().toString()
    inputs.property 'buildId', buildId
    inputs.property 'version', project.version
    filesMatching('META-INF/mods.toml') {
        expand version: project.version, buildId: buildId
    }
}

tasks.named('jar', Jar).configure {
    finalizedBy 'reobfJar'
}

// Stage JSON packs and fixtures for fresh command-line userdev runs without an IDE.
def prepareRunResources = tasks.register('prepareRunResources', Copy) {
    from layout.projectDirectory.dir('src/main/resources')
    into layout.projectDirectory.dir('run')
}

tasks.configureEach {
    if (name in ['runClient', 'runServer']) {
        dependsOn prepareRunResources
    }
}

// A normal dev world's water/terrain must never leak into GameTest fixtures.
def prepareGameTestResources = tasks.register('prepareGameTestResources', Copy) {
    from layout.projectDirectory.dir('src/main/resources')
    from layout.projectDirectory.dir('src/test/resources/gametest')
    into layout.projectDirectory.dir('run-gametest')
}

tasks.matching { it.name == 'runGameTestServer' }.configureEach {
    dependsOn prepareGameTestResources
    doLast {
        def focusedCount = ['samcnpc_local_autonomy': 10, 'samcnpc_pickup_zoo': 3, 'samcnpc_machine_zoo': 7, 'samcnpc_fishing_zoo': 10, 'samcnpc_explorer_zoo': 10, 'samcnpc_field_zoo': 6, 'samcnpc_mining_zoo': 10, 'samcnpc_shared_site_zoo': 9][gameTestNamespace]
        if (focusedCount == null) return
        def log = new File(workingDir, 'logs/latest.log').text
        if (!log.contains("All ${focusedCount} required tests passed") || log.readLines().any { it.contains('LogTestReporter') && it.contains(' failed!') }) {
            throw new GradleException("All ${focusedCount} required ${gameTestNamespace} regressions must pass")
        }
    }
}

def prepareLumberjackSmokeResources = tasks.register('prepareLumberjackSmokeResources', Copy) {
    from layout.projectDirectory.dir('src/main/resources')
    into layout.projectDirectory.dir('run-lumberjack-smoke')
}

def prepareConfigSmokeResources = tasks.register('prepareConfigSmokeResources', Copy) {
    from layout.projectDirectory.dir('src/main/resources')
    into layout.projectDirectory.dir('run-config-smoke')
}

tasks.matching { it.name == 'runClientConfigSmoke' }.configureEach {
    dependsOn prepareConfigSmokeResources, ':samcnpc-core:testClasses'
    def report = layout.projectDirectory.file('run-config-smoke/config-smoke-result.txt').asFile
    def companion = layout.projectDirectory.file('run-config-smoke/tool-settings-behavior-result.txt').asFile
    doFirst {
        report.parentFile.mkdirs()
        report.text = 'RUNNING\n'
        companion.text = 'RUNNING\n'
    }
    doLast {
        if (!report.text.trim().endsWith('PASS') || !companion.text.trim().endsWith('PASS')) {
            throw new GradleException("Configuration client smoke failed: ${report}")
        }
    }
}

tasks.matching { it.name == 'runClientLumberjackSmoke' }.configureEach {
    dependsOn prepareLumberjackSmokeResources
    def report = layout.projectDirectory.file('run-lumberjack-smoke/lumberjack-smoke-result.txt').asFile
    doFirst {
        report.parentFile.mkdirs()
        report.text = 'RUNNING\n'
    }
    doLast {
        if (!report.exists() || !report.text.trim().endsWith('PASS')) {
            throw new GradleException("Lumberjack client smoke did not pass: ${report}")
        }
    }
}

// P04 drives actual commands, saves/closes the integrated server and reopens the same world.
def prepareTaskSmokeResources = tasks.register('prepareTaskSmokeResources', Copy) {
    from layout.projectDirectory.dir('src/main/resources')
    into layout.projectDirectory.dir('run-task-smoke')
}
tasks.matching { it.name == 'runClientTaskSmoke' }.configureEach {
    dependsOn prepareTaskSmokeResources
    def report = layout.projectDirectory.file('run-task-smoke/task-smoke-result.txt').asFile
    doFirst { report.parentFile.mkdirs(); report.text = 'RUNNING\n' }
    doLast {
        if (!report.exists() || !report.text.trim().endsWith('PASS')) throw new GradleException("Task client smoke failed: ${report}")
    }
}

