// Separate run directories preserve each GUI variant's report during verifyAll.
['Bare': 'bare', 'Durable': 'durable'].each { suffix, folder ->
    def stage = tasks.register("prepareConfig${suffix}SmokeResources", Copy) {
        from layout.projectDirectory.dir('src/main/resources')
        into layout.projectDirectory.dir("run-config-${folder}-smoke")
    }
    tasks.matching { it.name == "runClientConfigSmoke${suffix}" }.configureEach {
        dependsOn stage, ':samcnpc-core:testClasses'
        def report = project.file("run-config-${folder}-smoke/config-smoke-result.txt")
        def companion = project.file("run-config-${folder}-smoke/tool-settings-behavior-result.txt")
        doFirst {
            report.parentFile.mkdirs()
            report.text = 'RUNNING\n'
            companion.text = 'RUNNING\n'
        }
        doLast {
            if (!report.text.trim().endsWith('PASS') || !companion.text.trim().endsWith('PASS')) {
                throw new GradleException("${suffix} configuration smoke failed: ${report}")
            }
        }
    }
}


// Ordinary dedicated runs retain Minecraft's actual pacing and save/load through separate JVMs.
def operationRuns = [
    runZooHour: [directory: "run-zoo-hour-${operationsSmokeId}", report: 'zoo-hour.txt', port: 25584],
    runZooHourProbe: [directory: "run-zoo-hour-probe-${operationsSmokeId}", report: 'zoo-hour.txt', port: 25585],
    runExplorerLifecycleDrop: [directory: "run-explorer-drop-${operationsSmokeId}", report: 'explorer-lifecycle.txt', port: 25582],
    runExplorerLifecycleKeep: [directory: "run-explorer-keep-${operationsSmokeId}", report: 'explorer-lifecycle.txt', port: 25583],
    runAcceptanceZoo: [directory: "run-acceptance-zoo-${operationsSmokeId}", report: 'acceptance-zoo.txt', port: 25581],
    runOperationsSmokeSave: [directory: "run-operations-${operationsSmokeId}", report: 'operations-save.txt', port: 25577],
    runOperationsSmokeLoad: [directory: "run-operations-${operationsSmokeId}", report: 'operations-load.txt', port: 25577],
    runOperationsLifecycle: [directory: "run-operations-lifecycle-${operationsSmokeId}", report: 'operations-lifecycle.txt', port: 25580],
    runOperationsPerformance: [directory: "run-operations-performance-${operationsSmokeId}", report: 'operations-performance.txt', port: 25578],
    runOperationsSoak: [directory: "run-operations-soak-${operationsSmokeId}", report: 'operations-soak.txt', port: 25579],
    runClientOperationsSmoke: [directory: "run-operations-client-${operationsSmokeId}", report: 'operations-client.txt'],
]
operationRuns.each { taskName, config ->
    def resources = tasks.register("prepare${taskName.substring(3)}Resources", Copy) {
        from layout.projectDirectory.dir('src/main/resources')
        into layout.projectDirectory.dir(config.directory)
    }
    tasks.matching { it.name == taskName }.configureEach {
        dependsOn resources
        def report = project.file("${config.directory}/${config.report}")
        doFirst {
            report.parentFile.mkdirs()
            report.text = 'RUNNING\n'
            if (config.port != null) {
                // Project-scoped EULA authorization: root AGENTS.md section12.
                new File(report.parentFile, 'eula.txt').text = 'eula=true\n'
                def settings = new File(report.parentFile, 'server.properties')
                if (!settings.exists()) settings.text = """server-ip=127.0.0.1
server-port=${config.port}
online-mode=true
level-name=world
level-type=minecraft:flat
generator-settings={"layers":[{"block":"minecraft:bedrock","height":1},{"block":"minecraft:dirt","height":2},{"block":"minecraft:grass_block","height":1}],"biome":"minecraft:plains"}
level-seed=0
generate-structures=false
view-distance=4
simulation-distance=4
max-players=1
spawn-protection=0
"""
            }
        }
        doLast { if (!report.text.startsWith('PASS ')) throw new GradleException("Operations verification failed: ${report}") }
    }
}
tasks.matching { it.name == 'runOperationsSmokeLoad' }.configureEach {
    mustRunAfter tasks.matching { it.name == 'runOperationsSmokeSave' }
    if (rootProject.ext.fullVerificationId != null || gradle.startParameter.taskNames.any { it.tokenize(':').last() == 'runOperationsSmokeSave' }) dependsOn 'runOperationsSmokeSave'
}

// The Core observer verifies final disposal in the same real server/client lifecycles.
[
    runClientTaskSmoke: [directory: 'run-task-smoke', count: 4],
    runOperationsLifecycle: [directory: "run-operations-lifecycle-${operationsSmokeId}", count: 1],
    runZooHour: [directory: "run-zoo-hour-${operationsSmokeId}", count: 1],
    runZooHourProbe: [directory: "run-zoo-hour-probe-${operationsSmokeId}", count: 1],
].each { taskName, config ->
    tasks.matching { it.name == taskName }.configureEach {
        dependsOn ':samcnpc-core:testClasses'
        def report = project.file("${config.directory}/core-lifecycle-result.txt")
        doFirst { report.parentFile.mkdirs(); report.text = 'RUNNING\n' }
        doLast {
            if (!report.exists() || !report.text.startsWith("PASS started=${config.count} stopped=${config.count} ")) {
                throw new GradleException("Core server lifecycle did not pass: ${report}")
            }
        }
    }
}

// Separate JVMs isolate each real Forge death-policy fixture.
tasks.matching { it.name in ['runExplorerLifecycleDrop', 'runExplorerLifecycleKeep'] }.configureEach {
    dependsOn ':samcnpc-core:testClasses'
}

// Generate author contracts from the same immutable descriptors as the runtime decoder.
tasks.register('exportOperationCatalog', JavaExec) {
    group = 'documentation'
    dependsOn 'testClasses'
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'io.samcnpc.behavior.api.OperationCatalogExport'
    javaLauncher = javaToolchains.launcherFor { languageVersion = JavaLanguageVersion.of(17) }
    args layout.buildDirectory.dir('operation-contracts').get().asFile.absolutePath
}

tasks.register('exportBehaviorCatalog', JavaExec) {
    group = 'documentation'
    dependsOn 'testClasses'
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'io.samcnpc.behavior.api.BehaviorCatalogExport'
    javaLauncher = javaToolchains.launcherFor { languageVersion = JavaLanguageVersion.of(17) }
    args rootProject.file('contracts/behavior-pack-registered.schema.json').absolutePath
}
tasks.named('test') { mustRunAfter 'exportBehaviorCatalog' }

// One disposable localhost world per campaign; save/load explicitly reuse its ID.
tasks.matching { it.name == 'runClientExternalMission' }.configureEach {
    dependsOn 'testClasses'
    def directory=project.file("run-external-client-${campaignId}")
    doFirst {
        directory.mkdirs()
        copy { from layout.projectDirectory.dir('src/main/resources'); into directory }
        copy { from project.file('src/test/resources/external-missions/tutorial.zip'); into new File(directory,'resources/samcnpc/behaviors') }
        new File(directory,'external-mission-client.txt').text='RUNNING\n'
    }
    doLast {
        def report=new File(directory,'external-mission-client.txt')
        if (!report.text.startsWith('PASS ')) throw new GradleException("Actual external mission client failed: ${report}")
    }
}

tasks.matching { it.name == 'runExternalMission' }.configureEach {
    dependsOn 'testClasses'
    def directory = project.file("run-external-mission-${campaignId}")
    doFirst {
        directory.mkdirs()
        copy { from layout.projectDirectory.dir('src/main/resources'); into directory }
        def bundles = new File(directory, 'resources/samcnpc/behaviors'); bundles.mkdirs()
        copy { from project.file('src/test/resources/external-missions/' + (campaignMode.startsWith('full') || campaignMode in externalWorkModes ? 'full.zip' : 'tutorial.zip')); into bundles }
        new File(directory, 'eula.txt').text = 'eula=true\n'
        def settings = new File(directory, 'server.properties')
        if (!settings.exists()) settings.text = """server-ip=127.0.0.1
server-port=25589
online-mode=true
level-name=world
level-type=minecraft:flat
generator-settings={"layers":[{"block":"minecraft:bedrock","height":1},{"block":"minecraft:dirt","height":2},{"block":"minecraft:grass_block","height":1}],"biome":"minecraft:plains"}
level-seed=20260928
generate-structures=false
view-distance=4
simulation-distance=4
max-players=1
spawn-protection=0
"""
        new File(directory,'external-mission-result.txt').text='RUNNING\n'
    }
    doLast {
        def report=new File(directory,'external-mission-result.txt')
        if (!report.text.startsWith('PASS_')) throw new GradleException("External mission proof failed: ${report}")
    }
}

tasks.register('verifyProductionKotlin') {
    group = 'verification'
    doLast {
        def sources = fileTree('src/main') { include '**/*.java' }.files
        if (!sources.empty) throw new GradleException("Production source must be Kotlin: ${sources}")
    }
}
tasks.named('check').configure { dependsOn tasks.named('verifyProductionKotlin') }
tasks.matching { it.name == 'runGameTestServer' }.configureEach {
    doLast {
        def report = new File(workingDir, 'logs/latest.log')
        if (!report.isFile()) throw new GradleException('Missing native test report')
        def failures=report.readLines('UTF-8').findAll { it.contains('/ERROR]') && it.contains('LogTestReporter') && it.contains(' failed!') }
        if (!failures.empty) throw new GradleException("Required native test failure: ${failures.first()}")
    }
}

tasks.withType(Jar).configureEach { archiveBaseName = 'samcnpc-behavior' }
